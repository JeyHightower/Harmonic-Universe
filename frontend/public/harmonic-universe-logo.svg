<svg width="680" height="220" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Harmonic Universe logo</title>
  <desc>A cosmic logo featuring concentric orbital rings around a central star, with the text Harmonic Universe beside it</desc>

  <style>
    .logo-bg { fill: #0d0d0f; }
    .ring { fill: none; stroke-linecap: round; }
    .r1 { stroke: #c9922a; stroke-width: 1.5; }
    .r2 { stroke: #8a611a; stroke-width: 1; }
    .r3 { stroke: #52514e; stroke-width: 0.75; }
    .dot { fill: #c9922a; }
    .dot-dim { fill: #8a611a; }
    .star-core { fill: #c9922a; }
    .star-ray { fill: none; stroke: #c9922a; stroke-width: 1; }
    .wave { fill: none; stroke: #c9922a; stroke-width: 1; stroke-linecap: round; }
    .wave-dim { fill: none; stroke: #8a611a; stroke-width: 0.75; stroke-linecap: round; }
    .text-main { font-family: 'Playfair Display', Georgia, serif; font-size: 36px; font-weight: 400; fill: #f0ede6; letter-spacing: -0.01em; }
    .text-sub { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #8c8a84; letter-spacing: 0.12em; }
    .text-accent { fill: #c9922a; }
    .divider { stroke: #2a2a35; stroke-width: 0.5; }
  </style>

  <rect width="680" height="220" rx="16" class="logo-bg"/>

  <g transform="translate(110, 110)">
    <ellipse cx="0" cy="0" rx="78" ry="28" class="ring r3" transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="58" ry="22" class="ring r2" transform="rotate(40)"/>
    <ellipse cx="0" cy="0" rx="40" ry="16" class="ring r1" transform="rotate(-5)"/>

    <circle cx="0" cy="0" r="10" class="star-core" opacity="0.15"/>
    <circle cx="0" cy="0" r="6" class="star-core" opacity="0.4"/>
    <circle cx="0" cy="0" r="3" class="star-core"/>

    <line x1="0" y1="-14" x2="0" y2="-10" class="star-ray"/>
    <line x1="0" y1="10" x2="0" y2="14" class="star-ray"/>
    <line x1="-14" y1="0" x2="-10" y2="0" class="star-ray"/>
    <line x1="10" y1="0" x2="14" y2="0" class="star-ray"/>

    <circle cx="40" cy="0" r="3.5" class="dot" transform="rotate(-5)"/>
    <circle cx="-58" cy="0" r="2.5" class="dot-dim" transform="rotate(40)"/>
    <circle cx="0" cy="-28" r="2" class="dot-dim" transform="rotate(-20) translate(78, 0) rotate(20)"/>

    <circle cx="66" cy="-10" r="1.5" fill="#52514e"/>
    <circle cx="-44" cy="18" r="1.5" fill="#52514e"/>
    <circle cx="20" cy="-24" r="1" fill="#52514e"/>
    <circle cx="-30" cy="-20" r="1" fill="#52514e"/>
  </g>

  <line x1="196" y1="55" x2="196" y2="165" class="divider"/>

  <g transform="translate(216, 108)">
    <text class="text-main" x="0" y="0" dominant-baseline="auto">
      <tspan class="text-accent">Harmonic</tspan>
    </text>
    <text class="text-main" x="0" y="44">Universe</text>
    <text class="text-sub" x="2" y="68">WORLDBUILDING STUDIO</text>
  </g>

  <g transform="translate(216, 178)">
    <path d="M0,0 Q8,-6 16,0 Q24,6 32,0 Q40,-6 48,0 Q56,6 64,0 Q72,-6 80,0 Q88,6 96,0 Q104,-6 112,0 Q120,6 128,0 Q136,-6 144,0 Q152,6 160,0" class="wave" opacity="0.5"/>
    <path d="M8,0 Q16,-4 24,0 Q32,4 40,0 Q48,-4 56,0 Q64,4 72,0 Q80,-4 88,0 Q96,4 104,0 Q112,-4 120,0 Q128,4 136,0 Q144,-4 152,0" class="wave-dim" opacity="0.3"/>
  </g>
</svg>